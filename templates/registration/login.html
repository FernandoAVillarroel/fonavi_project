{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso al sistema</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <style>
    html, body {
      height: 100%;
    }

    body {
      /* Fondo con gradiente lineal que simula la bandera */
      background: linear-gradient(135deg, #0d6efd, #e9ecef, #dc3545, #e9ecef, #0d6efd);
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">

  <main class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-4">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4 p-sm-5">
        
        <div class="text-center mb-4">
          <img src="{% static 'img/logo_ipvu.jpg' %}" class="img-fluid" style="max-height: 70px;" alt="Logo IPVU" onerror="this.onerror=null; this.src='{% static 'img/logo.svg' %}'">
        </div>

        <h1 class="h4 text-center fw-bold mb-4">Iniciar Sesión</h1>

        {% if form.non_field_errors %}
          <div class="alert alert-danger py-2 small" role="alert">
            {% for error in form.non_field_errors %}{{ error }}{% endfor %}
          </div>
        {% elif form.errors %}
          <div class="alert alert-danger py-2 small" role="alert">
            Usuario o contraseña incorrectos.
          </div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">

          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control {% if form.username.errors %}is-invalid{% endif %}"
              id="id_username"
              name="username"
              placeholder="Usuario"
              value="{{ form.username.value|default:'' }}"
              autocomplete="username"
              required
              autofocus>
            <label for="id_username"><i class="bi bi-person-fill me-2"></i>Usuario</label>
          </div>

          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control {% if form.password.errors %}is-invalid{% endif %}"
              id="id_password"
              name="password"
              placeholder="Contraseña"
              autocomplete="current-password"
              required>
            <label for="id_password"><i class="bi bi-lock-fill me-2"></i>Contraseña</label>
          </div>
          
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" name="remember">
              <label class="form-check-label small" for="remember">
                Recordarme
              </label>
            </div>
            <a href="{% url 'password_reset' %}" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg fw-bold">Entrar</button>
          </div>
        </form>
        
        <p class="text-center text-muted small mt-4 mb-0">© {% now "Y" %} — IPVU</p>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
