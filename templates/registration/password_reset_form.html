{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Recuperar contraseña</h1>
        <p class="text-muted">Ingresá tu correo electrónico asociado a tu usuario. Si tu cuenta no tiene correo registrado, contactá al área de Sistemas para asistencia.</p>
        <form method="post">
          {% csrf_token %}
          {{ form.email.errors }}
          <div class="mb-3">
            <label for="id_email" class="form-label">Correo electrónico</label>
            <input type="email" name="email" class="form-control" id="id_email" required>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <a href="{% url 'login' %}" class="btn btn-link">Volver al inicio de sesión</a>
            <button type="submit" class="btn btn-primary">Enviar instrucciones</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  </div>
{% endblock %}
